name: Sync to core release

# Chain A (wrapper): smartmemory-core publishes a new version -> repository_dispatch
# 'core-released' lands here. The wrapper exact-pins core and moves in lockstep, so
# we rewrite the ==pin, patch-bump our own version, and cut a release. The existing
# publish.yml (on release: published) then ships the new wrapper to PyPI.
on:
  repository_dispatch:
    types: [core-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'smartmemory-core version to pin (e.g. 0.9.48)'
        required: true
        type: string

concurrency:
  group: sync-core
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # PAT so the release we create actually triggers publish.yml
          # (events made by the default GITHUB_TOKEN do not trigger workflows).
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Bump core pin + wrapper version
        id: bump
        env:
          CORE_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys

          core = os.environ["CORE_VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", core):
              sys.exit(f"::error::Bad core version '{core}'")

          pp = pathlib.Path("pyproject.toml")
          text = pp.read_text()

          # Rewrite the exact pin, preserving an optional [extra] (e.g. [lite]).
          pin_re = re.compile(r'(["\'])smartmemory-core(\[[^\]]*\])?==[^"\']+\1')
          def repl(m):
              q, extra = m.group(1), m.group(2) or ""
              return f'{q}smartmemory-core{extra}=={core}{q}'
          text, n = pin_re.subn(repl, text)
          if n != 1:
              sys.exit(f"::error::Expected exactly 1 core pin, patched {n}")

          # COPY core's version verbatim (no increment): core is the single source
          # of truth, so core/wrapper/service always carry the exact same number.
          wv = core
          vm = re.search(r'^version = "[^"]+"', text, re.M)
          if not vm:
              sys.exit("::error::Could not find wrapper version line")
          text = text[:vm.start()] + f'version = "{wv}"' + text[vm.end():]
          pp.write_text(text)

          # Best-effort CHANGELOG entry under ## [Unreleased].
          cl = pathlib.Path("CHANGELOG.md")
          if cl.exists():
              c = cl.read_text()
              entry = (f"\n### Changed (auto, lockstep) — track smartmemory-core=={core} ({wv})\n"
                       f"- Version copied from smartmemory-core {core} release (single-source lockstep).\n")
              if "## [Unreleased]" in c:
                  c = c.replace("## [Unreleased]", "## [Unreleased]" + entry, 1)
                  cl.write_text(c)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"wrapper_version={wv}\n")
              f.write(f"core_version={core}\n")
          print(f"pinned smartmemory-core=={core}, wrapper -> {wv} (copied)")
          PY

      - name: Commit, push, release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          WV: ${{ steps.bump.outputs.wrapper_version }}
          CV: ${{ steps.bump.outputs.core_version }}
        run: |
          set -euo pipefail
          git config user.name "smartmem-dev[bot]"
          git config user.email "smartmem-dev@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes (already pinned to $CV); nothing to do."
            exit 0
          fi
          git add -A
          git commit -m "chore(deps): pin smartmemory-core==$CV, bump to $WV"
          git push origin HEAD:main
          gh release create "v$WV" \
            --title "v$WV" \
            --notes "Lockstep sync with smartmemory-core $CV."
          echo "✅ Released wrapper v$WV (publish.yml will ship to PyPI)."
