name: Sync to core release

# Chain A (wrapper): smartmemory-core publishes a new version -> repository_dispatch
# 'core-released' lands here. The wrapper exact-pins core + MCP and moves in
# lockstep, so we rewrite both ==pins, copy the product version, and cut a
# release. The existing publish.yml (on release: published) then ships the new
# wrapper to PyPI.
on:
  repository_dispatch:
    types: [core-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'smartmemory-core version to pin (e.g. 0.9.48)'
        required: true
        type: string

concurrency:
  group: sync-core
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # PAT so the release we create actually triggers publish.yml
          # (events made by the default GITHUB_TOKEN do not trigger workflows).
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'

      - name: Bump dependency pins + wrapper version
        id: bump
        env:
          CORE_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, pathlib, sys

          core = os.environ["CORE_VERSION"].strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", core):
              sys.exit(f"::error::Bad core version '{core}'")

          pp = pathlib.Path("pyproject.toml")
          text = pp.read_text()

          def rewrite_pin(package: str, version: str) -> None:
              nonlocal_text = rewrite_pin.text
              # Rewrite the exact pin, preserving an optional [extra] (e.g. [lite]).
              pin_re = re.compile(rf'(["\']){re.escape(package)}(\[[^\]]*\])?==[^"\']+\1')
              def repl(m):
                  q, extra = m.group(1), m.group(2) or ""
                  return f'{q}{package}{extra}=={version}{q}'
              updated, n = pin_re.subn(repl, nonlocal_text)
              if n != 1:
                  sys.exit(f"::error::Expected exactly 1 {package} pin, patched {n}")
              rewrite_pin.text = updated

          rewrite_pin.text = text
          rewrite_pin("smartmemory-core", core)
          rewrite_pin("smartmemory-mcp", core)
          text = rewrite_pin.text

          # COPY core's version verbatim (no increment): core is the single source
          # of truth, so core/wrapper/MCP/service always carry the exact same number.
          wv = core
          vm = re.search(r'^version = "[^"]+"', text, re.M)
          if not vm:
              sys.exit("::error::Could not find wrapper version line")
          text = text[:vm.start()] + f'version = "{wv}"' + text[vm.end():]
          pp.write_text(text)

          # Best-effort CHANGELOG entry under ## [Unreleased].
          cl = pathlib.Path("CHANGELOG.md")
          if cl.exists():
              c = cl.read_text()
              entry = (f"\n### Changed (auto, lockstep) — track smartmemory-core=={core} ({wv})\n"
                       f"- Version copied from smartmemory-core {core} release (single-source lockstep).\n")
              if "## [Unreleased]" in c:
                  c = c.replace("## [Unreleased]", "## [Unreleased]" + entry, 1)
                  cl.write_text(c)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"wrapper_version={wv}\n")
              f.write(f"core_version={core}\n")
          print(f"pinned smartmemory-core=={core}, smartmemory-mcp=={core}, wrapper -> {wv} (copied)")
          PY

      - name: Verify public dependency resolution before release
        env:
          CV: ${{ steps.bump.outputs.core_version }}
        run: |
          set -euo pipefail
          python - "$CV" <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request

          version = sys.argv[1]
          projects = ("smartmemory-core", "smartmemory-mcp")
          deadline = time.monotonic() + 45 * 60

          def has_release(project: str) -> bool:
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/{project}/{version}/json", timeout=20) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return False
                  raise
              return bool(payload.get("urls"))

          pending = set(projects)
          while pending and time.monotonic() < deadline:
              for project in tuple(pending):
                  if has_release(project):
                      print(f"{project}=={version} is available on PyPI")
                      pending.remove(project)
              if pending:
                  print(f"Waiting for PyPI releases: {', '.join(sorted(pending))}")
                  time.sleep(30)

          if pending:
              raise SystemExit(f"::error::Timed out waiting for PyPI releases: {', '.join(sorted(pending))}")
          PY
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m venv "$tmpdir/resolver-env"
          source "$tmpdir/resolver-env/bin/activate"
          python -m pip install --upgrade pip
          for attempt in {1..90}; do
            if pip install --dry-run --only-binary=:all: \
              "smartmemory-core[lite]==$CV" \
              "smartmemory-mcp==$CV"; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              echo "::error::Timed out waiting for pip resolver visibility for smartmemory-core/smartmemory-mcp $CV"
              exit 1
            fi
            echo "pip resolver did not see smartmemory-core/smartmemory-mcp $CV yet; retrying in 30s ($attempt/90)"
            sleep 30
          done
          deactivate

      - name: Commit, push, release, publish
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          WV: ${{ steps.bump.outputs.wrapper_version }}
          CV: ${{ steps.bump.outputs.core_version }}
        run: |
          set -euo pipefail
          git config user.name "smartmem-dev[bot]"
          git config user.email "smartmem-dev@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes (already pinned to $CV); no version commit needed."
          else
            git add pyproject.toml CHANGELOG.md
            git commit -m "chore(deps): pin smartmemory-core==$CV, bump to $WV"
            git push origin HEAD:main
          fi

          if gh release view "v$WV" >/dev/null 2>&1; then
            echo "Release v$WV already exists."
          else
            gh release create "v$WV" \
              --title "v$WV" \
              --notes "Lockstep sync with smartmemory-core $CV."
          fi

          # Do not rely solely on the release-created event. Explicit dispatch
          # makes reruns publish a missing artifact and keeps the lockstep chain
          # recoverable after PyPI propagation races.
          gh workflow run publish.yml --ref "v$WV"
          echo "✅ Ensured wrapper v$WV release and dispatched publish.yml."
