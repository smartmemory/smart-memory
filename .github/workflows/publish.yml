name: Publish smartmemory to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to Test PyPI instead of PyPI'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine hatchling pytest

      - name: Read package metadata
        id: meta
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          version = data["project"]["version"]
          def exact_pin(package: str) -> str:
              pins = [
                  dep
                  for dep in data["project"]["dependencies"]
                  if dep.startswith(package)
              ]
              if len(pins) != 1:
                  raise SystemExit(f"expected exactly one {package} pin, got {pins!r}")
              match = re.fullmatch(rf"{re.escape(package)}(?:\[[^\]]+\])?==(.+)", pins[0])
              if not match:
                  raise SystemExit(f"{package} dependency must be an exact pin, got {pins[0]!r}")
              return match.group(1)

          core_version = exact_pin("smartmemory-core")
          mcp_version = exact_pin("smartmemory-mcp")
          if core_version != version:
              raise SystemExit(f"smartmemory-core pin {core_version} must match wrapper version {version}")
          if mcp_version != version:
              raise SystemExit(f"smartmemory-mcp pin {mcp_version} must match wrapper version {version}")
          print(f"version={version}")
          print(f"core_version={core_version}")
          print(f"mcp_version={mcp_version}")
          PY

      - name: Block unresolved merge-conflict markers
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' \
              --exclude-dir=.git \
              --exclude-dir=.venv \
              --exclude-dir=venv \
              --exclude-dir=resolver-env \
              --exclude-dir=install-env \
              --exclude-dir=test-env \
              --exclude-dir=dist \
              --exclude-dir=build .; then
            echo "::error::Unresolved merge-conflict markers found."
            exit 1
          fi

      - name: Preflight public dependency resolution
        if: github.event.inputs.test_pypi != 'true'
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          python -m venv "$tmpdir/resolver-env"
          source "$tmpdir/resolver-env/bin/activate"
          python -m pip install --upgrade pip
          for attempt in {1..10}; do
            if pip install --dry-run --only-binary=:all: \
              "smartmemory-core[lite]==${{ steps.meta.outputs.core_version }}" \
              "smartmemory-mcp==${{ steps.meta.outputs.mcp_version }}"; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::Timed out waiting for pip resolver visibility for smartmemory-core/smartmemory-mcp ${{ steps.meta.outputs.core_version }}"
              exit 1
            fi
            echo "pip resolver did not see smartmemory-core/smartmemory-mcp ${{ steps.meta.outputs.core_version }} yet; retrying in 30s ($attempt/10)"
            sleep 30
          done
          deactivate

      - name: Install package and run release-blocking tests
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m pytest tests/unit/test_cli_ux.py tests/unit/test_launch_emission.py -q

      - name: Build package
        run: |
          set -euo pipefail
          rm -rf dist/ build/ *.egg-info
          python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify wheel contains proxy-immune daemon calls
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/smartmemory-*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, got {wheels!r}")
          with zipfile.ZipFile(wheels[0]) as zf:
              daemon = zf.read("smartmemory_app/daemon.py").decode()
              cli = zf.read("smartmemory_app/cli.py").decode()
              launch_metrics = zf.read("smartmemory_app/launch_metrics.py").decode()
          if daemon.count("trust_env=False") < 3:
              raise SystemExit("daemon.py is missing trust_env=False on local health/status calls")
          if "trust_env=False" not in cli:
              raise SystemExit("cli.py is missing trust_env=False on daemon requests")
          if "trust_env=False" not in launch_metrics:
              raise SystemExit("launch_metrics.py is missing trust_env=False on local daemon event emission")
          print("✅ Wheel contains proxy-immune local daemon calls")
          PY

      - name: Pre-upload clean install smoke
        if: github.event.inputs.test_pypi != 'true'
        run: |
          set -euo pipefail
          python -m venv install-env
          source install-env/bin/activate
          python -m pip install --upgrade pip
          pip install --find-links dist "smartmemory==${{ steps.meta.outputs.version }}" --only-binary=:all: --no-cache-dir
          smartmemory --version
          python - <<'PY'
          import inspect
          from smartmemory_app import cli, daemon, launch_metrics

          daemon_src = inspect.getsource(daemon)
          cli_src = inspect.getsource(cli)
          launch_metrics_src = inspect.getsource(launch_metrics)
          assert "trust_env=False" in daemon_src
          assert "trust_env=False" in cli_src
          assert "trust_env=False" in launch_metrics_src
          print("✅ Installed wheel has proxy-immune daemon code")
          PY
          deactivate

      - name: Publish to Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --repository testpypi --skip-existing dist/*

      - name: Publish to PyPI
        if: github.event.inputs.test_pypi != 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

      - name: Test installation
        if: github.event.inputs.test_pypi != 'true'
        run: |
          set -euo pipefail
          python -m venv test-env
          source test-env/bin/activate
          python -m pip install --upgrade pip
          for attempt in {1..10}; do
            if pip install "smartmemory==${{ steps.meta.outputs.version }}" --only-binary=:all: --no-cache-dir; then
              break
            fi
            if [ "$attempt" = "10" ]; then
              exit 1
            fi
            echo "PyPI propagation pending; retrying in 30s ($attempt/10)"
            sleep 30
          done
          smartmemory --version
          python - <<'PY'
          import inspect
          from smartmemory_app import cli, daemon, launch_metrics

          assert "trust_env=False" in inspect.getsource(daemon)
          assert "trust_env=False" in inspect.getsource(cli)
          assert "trust_env=False" in inspect.getsource(launch_metrics)
          print("✅ PyPI install has proxy-immune daemon code")
          PY
          deactivate

      - name: Notify Discord
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No webhook configured, skipping"; exit 0; fi
          python3 - << 'PY'
          import json, os, sys, urllib.request, urllib.error
          webhook = os.environ["DISCORD_WEBHOOK"]
          status = os.environ.get("STATUS", "").lower()
          repo = os.environ["REPO"]
          run_url = os.environ["RUN_URL"]
          emoji, color = ("✅", 3066993) if status == "success" else ("⚪", 9807270) if status == "cancelled" else ("❌", 15158332)
          desc = "" if status == "success" else run_url
          payload = json.dumps({"embeds": [{"title": f"{emoji} {repo}", "description": desc, "color": color}]}).encode()
          try:
              req = urllib.request.Request(webhook, data=payload, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=10)
              print("Discord notification sent")
          except Exception as e:
              print(f"Discord notification failed (non-fatal): {e}", file=sys.stderr)
          PY
