[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartmemory"
version = "1.4.94"
requires-python = ">=3.11"
dependencies = [
    "smartmemory-core[lite]==1.4.94",  # EXACT pin — wrapper and core versions move in lockstep
    "filelock>=3.12",                    # cross-process SQLite write locking
    "smartmemory-mcp==1.4.91",        # EXACT pin. NOT in the core release sync chain (unlike
                                     # smartmemory-core above) — nothing bumps this for you, so it
                                     # tracks the latest PUBLISHED smartmemory-mcp, not this version.
                                     # release.sh warns when a newer one exists. mcp does not depend
                                     # on smartmemory-core, so this pin cannot conflict with it.
    "httpx>=0.27",             # remote API calls (DIST-LITE-5)
    "fastapi>=0.110",          # DIST-LITE-4: local graph API + viewer
    "uvicorn>=0.29",           # DIST-LITE-4: viewer HTTP server
    "click>=8.0",
    "keyring>=24.0",           # DIST-LITE-5: OS credential store for API keys
    "tomli-w>=1.0",            # DIST-LITE-5: TOML config writing (tomllib stdlib reads only)
    "textual>=8.0",            # TUI for setup questionnaire
    "tiktoken>=0.7",           # DIST-TOUR-1: real token receipt in `sm tour`
]

[project.optional-dependencies]
tui = ["textual>=8.0"]         # kept for backward compat (now included by default)

[project.scripts]
smartmemory = "smartmemory_app.cli:cli"
sm = "smartmemory_app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["smartmemory_app"]
include = [
    "smartmemory_app/data/seed_patterns.jsonl",
    "smartmemory_app/data/*.plist",
    "smartmemory_app/static/**/*",
    "smartmemory_app/hooks/*.sh",
    "smartmemory_app/skills/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring real filesystem/subprocess (no mocks)",
    "needs_live_daemon: tests that bind localhost and require an unsandboxed daemon",
]
